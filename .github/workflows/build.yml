name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    name: linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ARTIFACT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install deps (build tide from source + libtcd)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ make \
            curl ca-certificates xz-utils \
            libtcd-dev \
            xtide-data \
            libx11-dev libxt-dev libxaw7-dev libxpm-dev libxmu-dev \
            libpng-dev \
            sharutils

      - name: Build & install XTide (provides tide)
        run: |
          set -euo pipefail
          XTIDE_VER="2.16"
          XTIDE_URL="https://flaterco.com/files/xtide/xtide-${XTIDE_VER}.tar.xz"

          rm -rf _deps
          mkdir -p _deps
          cd _deps

          curl -L --retry 3 --retry-delay 2 -o xtide.tar.xz "${XTIDE_URL}"
          tar -xf xtide.tar.xz

          cd "xtide-${XTIDE_VER}"
          ./configure --prefix="$PWD/../xtide-install"
          make -j"$(nproc)"
          make install

          echo "$PWD/../xtide-install/bin" >> "$GITHUB_PATH"

      - name: Configure (release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j

      - name: Smoke test (Linux)
        run: |
          set -euo pipefail
          ./build/your_tool --help
          tide -V || tide --version || true
          # harmonics file from xtide-data (path varies by distro/package revision)
          HFILE="$(dpkg -L xtide-data | grep -E 'harmonics.*\.tcd$' | head -n 1 || true)"
          if [[ -n "${HFILE}" ]]; then
            echo "Found harmonics: ${HFILE}"
            export HFILE_PATH="${HFILE}"
            tide -h >/dev/null
          fi

      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          cp -f build/your_tool dist/

          [ -f README.md ] && cp -f README.md dist/ || true
          [ -f LICENSE ] && cp -f LICENSE dist/ || true

          tar -czf your_tool-${{ env.ARTIFACT_TAG }}-linux-amd64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: your_tool-${{ env.ARTIFACT_TAG }}-linux-amd64.tar.gz

  linux-arm64:
    name: linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ARTIFACT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install deps (build tide from source + libtcd)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ make \
            curl ca-certificates xz-utils \
            libtcd-dev \
            xtide-data \
            libx11-dev libxt-dev libxaw7-dev libxpm-dev libxmu-dev \
            libpng-dev \
            sharutils

      - name: Build & install XTide (provides tide)
        run: |
          set -euo pipefail
          XTIDE_VER="2.16"
          XTIDE_URL="https://flaterco.com/files/xtide/xtide-${XTIDE_VER}.tar.xz"

          rm -rf _deps
          mkdir -p _deps
          cd _deps

          curl -L --retry 3 --retry-delay 2 -o xtide.tar.xz "${XTIDE_URL}"
          tar -xf xtide.tar.xz

          cd "xtide-${XTIDE_VER}"
          ./configure --prefix="$PWD/../xtide-install"
          make -j"$(nproc)"
          make install

          echo "$PWD/../xtide-install/bin" >> "$GITHUB_PATH"

      - name: Configure (release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build -j

      - name: Smoke test (Linux)
        run: |
          set -euo pipefail
          ./build/your_tool --help
          tide -V || tide --version || true

      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          cp -f build/your_tool dist/

          [ -f README.md ] && cp -f README.md dist/ || true
          [ -f LICENSE ] && cp -f LICENSE dist/ || true

          tar -czf your_tool-${{ env.ARTIFACT_TAG }}-linux-arm64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: your_tool-${{ env.ARTIFACT_TAG }}-linux-arm64.tar.gz

  windows-x64:
    name: windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ca-certificates
            unzip
            git
            curl
            tar

      - name: Compute artifact tag
        shell: msys2 {0}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ARTIFACT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Configure (release)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build -j

      - name: Package portable zip
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf dist your_tool-${{ env.ARTIFACT_TAG }}-windows-x64.zip
          mkdir -p dist

          cp -f build/your_tool.exe dist/your_tool.exe

          [ -f README.md ] && cp -f README.md dist/ || true
          [ -f LICENSE ] && cp -f LICENSE dist/ || true

          ( cd dist && cmake -E tar cfv ../your_tool-${{ env.ARTIFACT_TAG }}-windows-x64.zip --format=zip . )

      - name: Smoke test (Windows)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf unpack
          mkdir -p unpack
          cd unpack
          cmake -E tar xvf ../your_tool-${{ env.ARTIFACT_TAG }}-windows-x64.zip
          ./your_tool.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: your_tool-${{ env.ARTIFACT_TAG }}-windows-x64.zip

  publish:
    name: publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-amd64, linux-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux-amd64/*.tar.gz
            release-assets/linux-arm64/*.tar.gz
            release-assets/windows-x64/*.zip
